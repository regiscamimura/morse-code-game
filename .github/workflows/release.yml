name: Release

# When the bot's Release PR merges: tag the merge commit with the version in the PR
# title, publish a GitHub Release, build the signed bundle and send it to production
# on Google Play, where it goes live once Google approves it.
#
# If the upload fails, use "Re-run failed jobs": a whole re-run also works, because
# the tagging job accepts a tag that already exists.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'release'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Tag and publish the GitHub Release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          version="$(printf '%s' "$PR_TITLE" | sed -nE 's/^Release (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$version" ]; then
            echo "::error::PR title is not 'Release vX.Y.Z': refusing to tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null \
             || gh release view "$version" >/dev/null 2>&1; then
            echo "${version} is already tagged."
            exit 0
          fi

          version_pattern="$(printf '%s' "$version" | sed 's/[.]/\\./g')"
          notes="$(git show "${MERGE_SHA}:CHANGELOG.md" 2>/dev/null \
            | awk -v v="## ${version_pattern} " '$0 ~ "^"v {f=1;print;next} f&&/^#/{exit} f{print}' || true)"
          [ -n "$notes" ] || notes="$PR_BODY"

          gh release create "$version" --target "$MERGE_SHA" --title "$version" --notes "$notes"

  publish-to-play:
    needs: tag-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.tag-and-release.outputs.version }}
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag-and-release.outputs.version }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
          cache-disabled: true

      - name: Install the Android NDK and platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ANDROID_NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build the signed bundle
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # v0.1.3 = versionCode 103. Play only accepts a higher code than the last one,
          # and the code is fixed by the tag, so a rebuild gives the same number.
          # ponytail: minor and patch must stay under 100; switch to a wider multiplier
          # that keeps codes rising if a release ever gets near that.
          IFS=. read -r major minor patch <<< "${VERSION#v}"
          major=$((10#$major)); minor=$((10#$minor)); patch=$((10#$patch))
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::$VERSION doesn't fit the versionCode scheme: minor and patch must stay under 100."
            exit 1
          fi
          export MORSE_VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          export MORSE_VERSION_NAME="${VERSION#v}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          echo "Building $MORSE_VERSION_NAME, versionCode $MORSE_VERSION_CODE"

          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$UPLOAD_STORE_PASSWORD" "$UPLOAD_KEY_ALIAS" "$UPLOAD_KEY_PASSWORD" \
            > go/android/keystore.properties
          umask 022

          sh go/android/build.sh release

          # The upload step runs third-party code: leave no signing key behind for it.
          rm -f "$RUNNER_TEMP/upload.jks" go/android/keystore.properties

      - name: Write Play's "What's new" from the CHANGELOG
        run: |
          set -euo pipefail
          version_pattern="$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')"
          mkdir whatsnew
          # Play allows 500 characters per language; other languages fall back to en-US.
          awk -v v="## ${version_pattern} " '$0 ~ "^"v {f=1;next} f&&/^#/{exit} f{print}' CHANGELOG.md \
            | python3 -c 'import sys; print(sys.stdin.read().strip()[:500])' > whatsnew/whatsnew-en-US
          cat whatsnew/whatsnew-en-US

      - name: Upload to Google Play production
        # v1.1.5, pinned to the commit because this action receives the Play key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.regiscamimura.morse
          releaseFiles: go/android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ needs.tag-and-release.outputs.version }}
          track: production
          status: completed
          whatsNewDirectory: whatsnew
