# Builds the cartridges bundle (play.py) as a one-file executable per OS with PyInstaller.
# Run it by hand from the Actions tab, or push a tag like v1.0 to also publish a release.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: cartridges-linux-x64
          - os: macos-latest
            name: cartridges-macos-arm64
          - os: windows-latest
            name: cartridges-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller sounddevice
      - run: python play.py --selftest
      - run: pyinstaller --onefile --name ${{ matrix.name }} play.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
